services:
  # ===================
  # Application Services
  # ===================
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wordle-group-php
    restart: on-failure
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - wordle-group-network
      - mailpit_default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PHP_MEMORY_LIMIT=512M

  nginx:
    image: nginx:alpine
    container_name: wordle-group-nginx
    restart: on-failure
    ports:
      - "127.0.0.1:8033:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wordle-group-network
    depends_on:
      - php

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wordle-group-queue
    restart: on-failure
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - wordle-group-network
      - mailpit_default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=1024

  # ===================
  # Data Services
  # ===================
  postgres:
    image: postgres:17-alpine
    container_name: wordle-group-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: wordle_group
      POSTGRES_USER: wordle_group
      POSTGRES_PASSWORD: wordlegroup-dev-secret
    volumes:
      - wordle-group-postgres-data:/var/lib/postgresql/data
      - ./storage/app/dumps:/dumps
    ports:
      # 5433 on the host, so the stack can run alongside Herd's PostgreSQL.
      - "127.0.0.1:5433:5432"
    networks:
      - wordle-group-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordle_group -d wordle_group"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wordle-group-redis
    restart: on-failure
    volumes:
      - wordle-group-redis-data:/data
    ports:
      - "127.0.0.1:6394:6379"
    networks:
      - wordle-group-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Shared Services (not per-project)
  # ===================
  # Mail: mailpit-up → http://mailpit.test (SMTP: mailpit:1025)
  # S3:   minio-up → http://minio.test (API: host.docker.internal:9000)

networks:
  wordle-group-network:
    driver: bridge
  mailpit_default:
    external: true

volumes:
  # wordle-group-mysql-data is retired and deliberately NOT declared here.
  # Compose deletes exactly the named volumes declared in this block on
  # `docker compose down -v`, so declaring it is what would put the archived
  # MySQL data at risk. Nothing references it any more; `docker volume rm` is
  # the only way to lose it.
  wordle-group-postgres-data:
  wordle-group-redis-data:
